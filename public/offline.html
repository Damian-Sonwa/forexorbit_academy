<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171717" />
    <title>ForexOrbit — Offline</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #F7F7F7;
        color: #171717;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        text-align: center;
        background: #fff;
        border-radius: 16px;
        padding: 2rem 1.75rem;
        box-shadow: 0 1px 2px rgba(23, 23, 23, 0.06);
        border: 1px solid #E5E5E5;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        color: #171717;
      }
      p {
        margin: 0 0 1.25rem;
        line-height: 1.55;
        color: #444;
      }
      button {
        background: #B85C0E;
        color: #fff;
        border: none;
        padding: 0.65rem 1.25rem;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover {
        filter: brightness(1.05);
      }
      .hint {
        font-size: 0.875rem;
        color: #666;
        margin-top: 1rem;
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You’re offline</h1>
      <p>
        ForexOrbit can’t reach the network right now. Check your connection, then try again.
        Cached lessons and pages may still open once you’re back online.
      </p>
      <button type="button" onclick="location.reload()">Retry</button>
      <p class="hint">If you’re on a plane or subway, this screen is normal — we’ll reconnect when you are.</p>
    </div>
  </body>
</html>
